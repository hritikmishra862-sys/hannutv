name: onyxtube
description: HANNUTV Flutter Movie and Series Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  http: ^1.2.2
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.7.0
  app_links: ^6.1.1
  
  # 🔥 Locked to stable version to bypass Kotlin Android crash 🔥
  google_sign_in: ^6.2.2
  
  # 🔥 'any' allows Flutter to auto-sync perfectly with google_sign_in 6.2.2 🔥
  firebase_core: any
  firebase_messaging: any
  firebase_remote_config: any
  firebase_auth: any
  cloud_firestore: any
  firebase_database: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png